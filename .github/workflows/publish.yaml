name: Deploy website to S3

env:
  # HugoBlox kit needs Hugo extended >= 0.161.1, Go (Hugo Modules), and Node >= 22 + pnpm (Tailwind, Pagefind).
  WC_HUGO_VERSION: '0.167.0'
  HUGO_CACHEDIR: /tmp/hugo_cache_runner/
  AWS_REGION: eu-west-1     
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  # DOMAIN_NAME lives on the github-pages environment (deploy job); builds fall back to the production domain.
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME || 'www.garageeducation.org' }}

on:
  push:
    branches: ["main"]
  # Pull requests build only; the deploy job is skipped for them.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Node dependencies (Tailwind, Pagefind)
      run: npx --yes pnpm@10.14.0 install --frozen-lockfile
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ env.WC_HUGO_VERSION }}
        extended: true
    - uses: actions/cache@v4
      with:
        path: /tmp/hugo_cache_runner/
        key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-hugomod-
    - name: Build with Hugo
      env:
        HUGO_ENVIRONMENT: production
      run: |
        hugo --gc --minify --baseURL "https://${{ env.DOMAIN_NAME }}/"
    - name: Generate Pagefind search index
      run: npx --yes pnpm@10.14.0 run pagefind
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: website-files
        path: public

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: website-files
        path: public
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy to AWS S3
      run: |
        aws s3 sync public s3://${{ env.DOMAIN_NAME }} --delete
        aws cloudfront create-invalidation --distribution-id E1CF7XOS3V85HR  --paths "/*"
        aws cloudfront create-invalidation --distribution-id E14SJE4M9FKDNO --paths "/*"

