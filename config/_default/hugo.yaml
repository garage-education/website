# Hugo configuration
# https://gohugo.io/getting-started/configuration/

title: "Garage Education"
baseURL: 'https://www.garageeducation.org/'
copyright: "© {year} Garage Education"

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
hasCJKLanguage: false
removePathAccents: true

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: ["\\.ipynb$", ".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$"]
permalinks:
  authors: '/author/:slug/'
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
outputs:
  home: [HTML, RSS, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 85
  webp:
    quality: 85
    hint: picture
timeout: 600000
taxonomies:
  tag: tags
  category: categories
  author: authors
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  exec:
    # Hugo >= 0.163 no longer allows tailwindcss by default; HugoBlox needs it.
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
sitemap:
  _merge: deep

############################
## PAGE OPTIONS
############################

cascade:
  # Courses (the docs section)
  - target:
      path: '{/docs,/docs/**}'
    params:
      share: true
      show_date: false
      show_date_updated: true
      show_breadcrumb: true
  # Blog posts
  - target:
      path: /blog/**
      kind: page
    params:
      pager: true
      show_date_updated: true
      reading_time: true
      commentable: false
      show_related: true
      share: true
