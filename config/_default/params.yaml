# HugoBlox site parameters
# https://docs.hugoblox.com/

hugoblox:
  schema: "2.0"
  identity:
    name: "Garage Education"
    organization: "Garage Education"
    type: organization # person | organization | local_business
    tagline: ""
    description: "Garage Education is a nonprofit organization. Free, open-source courses in data engineering, distributed systems, and AI engineering."
    social:
      twitter: "garageeducation"
  theme:
    mode: light
    pack: "default"
    colors:
      primary: "#2563eb"
  typography:
    pack: "humanist"
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
  footer:
    style: minimal
    language_switcher: false
  copyright:
    notice: "© {year} Garage Education. This work is licensed under {license}"
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false
  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: false
  search:
    enable: true
  repository:
    enable: false
    url: "https://github.com/garage-education/website"
    branch: main
    content_dir: content
  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us
